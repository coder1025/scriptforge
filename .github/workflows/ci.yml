name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify without external model access
        run: mvn --batch-mode --no-transfer-progress spotless:check clean verify
      - name: Check frontend syntax
        run: node --check src/main/resources/static/app.js
      - name: Smoke-test packaged demo
        shell: bash
        run: |
          java -jar target/scriptforge-0.1.0.jar > /tmp/scriptforge-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --noproxy '*' -fsS http://127.0.0.1:8080/api/config > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: scriptforge-jar
          path: target/scriptforge-0.1.0.jar

